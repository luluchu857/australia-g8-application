interface:
  display_name: "澳洲八大申请"
  short_description: "澳洲八大预科、本科和研究生的选校、案例、材料，并衔接联合招生官"
  default_prompt: "使用 $australia-g8-application 帮我看澳洲八大申请，整理材料和下一步。"

dependencies:
  tools:
    - type: "mcp"
      value: "liuxue-info-query"
      description: "留学信息查询：院校、专业、匿名案例、排名、费用等"
      transport: "streamable_http"
      url: "https://hi.xwoork.cn/info/mcp"
    - type: "mcp"
      value: "liuxue-application-helper"
      description: "留学申请辅助：材料、文书、时间线和联合招生官入口；学生使用无需 Key"
      transport: "streamable_http"
      url: "https://hi.xwoork.cn/assist/mcp"

policy:
  allow_implicit_invocation: true
